name: 01 - CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:


jobs:

  # =========================================================
  # Infrastructure as Code
  # Terraform creates the resource group, ACR, AKS cluster
  # and storage account that the rest of the pipeline uses.
  # =========================================================
  terraform:
    name: Terraform Provision Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Azure credentials for Terraform
        working-directory: .
        env:
          AZURE_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          CLIENT_SECRET=$(echo "$AZURE_CREDS" | jq -r .clientSecret)
          echo "::add-mask::$CLIENT_SECRET"
          echo "ARM_CLIENT_ID=$(echo "$AZURE_CREDS" | jq -r .clientId)" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=$CLIENT_SECRET" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$(echo "$AZURE_CREDS" | jq -r .tenantId)" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$(echo "$AZURE_CREDS" | jq -r .subscriptionId)" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      # Pull requests only plan. Infrastructure changes on main.
      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show Terraform outputs
        if: github.event_name != 'pull_request'
        run: terraform output


  # =========================================================
  # Backend Tests
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          pytest -v


  # =========================================================
  # Build, Scan and Push Docker Images
  # Every image is scanned by Docker Scout before it can be
  # pushed to the registry that Terraform created.
  # =========================================================
  build-scan-push:
    name: Build, Scan and Push ${{ matrix.image }}
    runs-on: ubuntu-latest

    needs:
      - terraform
      - backend-test

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    env:
      IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t "$IMAGE" \
            ./${{ matrix.service }}

      # Docker Scout needs a Docker Hub login to download its CVE database.
      - name: Login to Docker Hub for Docker Scout
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Report: every critical and high CVE, published on the run summary
      # and saved as a SARIF file.
      - name: Docker Scout CVE report
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ env.IMAGE }}
          only-severities: critical,high
          summary: true
          write-comment: false
          sarif-file: scout-${{ matrix.image }}.sarif
          exit-code: false

      - name: Upload Docker Scout report
        uses: actions/upload-artifact@v4
        with:
          name: scout-${{ matrix.image }}
          path: scout-${{ matrix.image }}.sarif

      # Gate: a critical CVE that already has a fix available stops the
      # job here, so the image is never pushed.
      - name: Docker Scout security gate
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ env.IMAGE }}
          only-severities: critical
          only-fixed: true
          summary: false
          write-comment: false
          exit-code: true

      - name: Push Docker image with commit SHA
        run: |
          docker push "$IMAGE"
