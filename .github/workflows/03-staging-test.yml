name: 03 - Test Staging

on:
  workflow_run:
    workflows:
      - "02 - Deploy to Staging"
    types:
      - completed
    branches:
      - main

jobs:
  smoke-test:
    name: Staging Smoke Test
    runs-on: ubuntu-latest

    if: github.event.workflow_run.conclusion == 'success'

    environment:
      name: staging

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Wait for staging frontend IP
        run: |
          for i in {1..30}; do

            FRONTEND_IP=$(kubectl get service frontend \
              -n staging \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$FRONTEND_IP" ]; then
              echo "FRONTEND_IP=$FRONTEND_IP" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Waiting for staging frontend IP..."

            sleep 10
          done

          echo "Unable to find staging frontend IP."
          exit 1

      - name: Test frontend
        run: |
          curl \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            http://${{ env.FRONTEND_IP }}

      # The application is only considered healthy in staging when
      # Prometheus is actually scraping all five backend services.
      - name: Test application monitoring
        run: |
          kubectl port-forward \
            -n monitoring \
            svc/prometheus-kube-prometheus-prometheus \
            9090:9090 > /dev/null 2>&1 &

          sleep 5

          for i in {1..30}; do

            UP_COUNT=$(curl -sG http://localhost:9090/api/v1/query \
              --data-urlencode 'query=count(up{namespace="staging",job=~".*-service"} == 1)' \
              | jq -r '.data.result[0].value[1] // "0"')

            echo "Backend services scraped by Prometheus: ${UP_COUNT:-0} of 5"

            if [ "${UP_COUNT:-0}" = "5" ]; then
              curl -sG http://localhost:9090/api/v1/query \
                --data-urlencode 'query=up{namespace="staging",job=~".*-service"}' \
                | jq -r '.data.result[] | "\(.metric.job)  up=\(.value[1])"'
              exit 0
            fi

            sleep 10
          done

          echo "Prometheus is not scraping all five backend services."
          exit 1
